// Shared settings for every loader module.
//
// `common/src` holds all gameplay code and is compiled into each platform jar by that
// platform's own Gradle plugin. It is intentionally not a Gradle project: a plain
// java-library module has no Minecraft classpath, and giving it one would mean applying a
// loader plugin to it, which defeats the point of keeping it loader-free.

subprojects {
    group = project.maven_group
    version = project.mod_version
}

/**
 * Guards the one rule that keeps this build maintainable: `common/src` must never import a
 * loader's classes. Without this, the next small fix "just for Fabric" silently makes the
 * shared sources platform-specific and the NeoForge jar stops compiling weeks later.
 */
tasks.register('checkCommonPurity') {
    group = 'verification'
    description = 'Fails if common/src imports loader-specific classes.'

    doLast {
        def pattern = ~/net\.fabricmc|net\.neoforged|net\.minecraftforge|terraformersmc/
        def offenders = fileTree('common/src') {
            include '**/*.java'
        }.findAll { it.getText('UTF-8') =~ pattern }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "Loader imports found in common/src (move them to a platform module):\n" +
                            offenders.collect { "  ${it.path}" }.join('\n'))
        }
    }
}
