plugins {
    id "fabric-loom" version "1.9-SNAPSHOT"
    id "maven-publish"
}

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.wispforest.io/releases" }
    mavenCentral()
}

// All gameplay code lives in ../common/src; this module only adds the Fabric entrypoint,
// fabric.mod.json and the Mod Menu hook.
sourceSets {
    main {
        java {
            srcDirs = ["../common/src/main/java", "src/main/java"]
        }
        resources {
            srcDirs = ["../common/src/main/resources", "src/main/resources"]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Optional: only used for the config button in Mod Menu.
    modCompileOnly "maven.modrinth:modmenu:11.0.3"

    // Optional compat targets. `modImplementation` puts them on the compile and dev-run
    // classpaths; Loom does not bundle them into the output jar, and every provider is loaded
    // behind an isModLoaded() guard.
    modImplementation "maven.modrinth:accessories:1.1.0-beta.54+1.21.1"
    modImplementation "maven.modrinth:trinkets:3.10.0"
    // TrinketComponent extends CCA's ComponentV3, so the CCA modules are needed on the
    // compile classpath. The published bundle only contains nested jars, hence the modules.
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3"
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Present in the dev runtime so `runClient` exercises the real providers. These never end up
    // in the built jar.
    modLocalRuntime "maven.modrinth:owo-lib:0.12.15.4+1.21"
    // Trinkets bundles CCA as nested jars; the dev runtime needs the modules loose.
    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3"
    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3"
    // owo-lib bundles Endec as a nested jar, which Loom strips while remapping mods. Endec is
    // plain Java, so a plain runtime entry restores the classes Accessories' mixins expect.
    localRuntime "io.wispforest:endec:0.1.5.1"
    modLocalRuntime "io.wispforest.endec:netty:0.1.2"
    modLocalRuntime "io.wispforest.endec:gson:0.1.3.1"
    modLocalRuntime "io.wispforest.endec:jankson:0.1.3.1"
    localRuntime "blue.endless:jankson:1.2.2"
    localRuntime "org.jetbrains:annotations:24.1.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    // DevCheck is a headless self-test, not part of the shipped mod.
    exclude "com/toancao/loadouttc/DevCheck*.class"
}

// Temporary: headless logic check for slot filters / sorting. Not part of the jar.
tasks.register('devCheck', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.toancao.loadouttc.DevCheck'
}

// Testing loop: every build drops the jar into the launcher profile, so no manual copying.
tasks.register('deployMod', Copy) {
    group = 'fabric'
    description = 'Copy the remapped jar into the Modrinth profile mods folder.'
    dependsOn tasks.named('remapJar')
    def target = file(project.findProperty('modrinth_mods_dir')
            ?: 'D:/Modrinth/profiles/OptiFabric/mods')
    from(tasks.named('remapJar').flatMap { it.archiveFile })
    into(target)
    // Skipped on CI and on machines without that launcher profile: the copy is a local
    // convenience, not part of a releasable build.
    onlyIf { target.parentFile != null && target.parentFile.isDirectory() }
    doFirst {
        // The current name is overwritten; clear leftovers from older versions.
        if (target.isDirectory()) {
            target.listFiles()?.findAll {
                it.name.startsWith('loadouttc-') && it.name.endsWith('.jar')
            }?.each { it.delete() }
        }
    }
}

// Release jars are named `loadouttc-<version>-fabric.jar` so the two loaders cannot be mixed up.
tasks.named('jar') {
    archiveClassifier = 'fabric'
}
tasks.named('remapJar') {
    archiveClassifier = 'fabric'
}

tasks.named('build') {
    dependsOn rootProject.tasks.named('checkCommonPurity')
    finalizedBy 'deployMod'
}
